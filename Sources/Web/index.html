<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitals</title>
<meta name="theme-color" content="#0c0d0f">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vitals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.png">
<style>
/* The menu bar app's tokens (Sources/App/Theme.swift): true-black flat, depth is a lightness step,
   colour lives on data only. */
:root {
  --ground: #0c0d0f; --surface: #15171a; --raised: #24272c; --line: #202328; --grid: #23262b;
  --text: #fff; --muted: #b4b4b4; --faint: #8f9296;
  --accent: #c6f24e; --warning: #e5a93b; --negative: #e5566f;
  --chart2: #e6e6e6; --chart3: #6b6b6b; --chart4: #34383e;
  --gap: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ground); -webkit-text-size-adjust: 100%; }
body {
  background: var(--ground); color: var(--text);
  font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; overscroll-behavior-y: none;
  padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  max-width: 560px; margin: 0 auto;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-user-select: none; user-select: none; }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* Header: brand and status; the host switcher drops to its own row on a phone. */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0 16px; }
.brand, #stamp { height: 56px; display: flex; align-items: center; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 17px; }
.brand img { width: 26px; height: 26px; border-radius: 7px; }
#stamp { color: var(--faint); font-size: 13px; }
.hosts { order: 3; flex: 1 0 100%; margin-bottom: 4px; }
.seg { display: flex; background: var(--raised); border-radius: 999px; padding: 2px; }
.seg button { flex: 1; height: 32px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; padding: 0 14px; transition: background .15s, color .15s; }
.seg button:not(:disabled):not(.on):hover { color: var(--text); }
.seg button.on { background: var(--text); color: var(--ground); }
.seg button:disabled { color: var(--chart3); cursor: default; }
.seg button.on:disabled { background: var(--chart3); color: var(--ground); }
.hosts button { display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; }
.hosts { overflow-x: auto; scrollbar-width: none; }
.hosts::-webkit-scrollbar { display: none; }
.hosts button { flex: 1 0 auto; }

/* The fleet: every Mac at a glance; tap one to see it. */
#fleetCard { order: -1; }
.fleet { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
@media (min-width: 900px) { .fleet { grid-template-columns: repeat(auto-fill, minmax(190px, 240px)); } }
.mac { text-align: left; background: var(--raised); border-radius: 12px; padding: 11px 12px; border: 1.5px solid transparent; transition: border-color .15s, background .15s; min-width: 0; }
.mac:hover { background: #2a2d33; }
.mac.on { border-color: var(--text); }
.mac.none { background: none; border: 1.5px dashed var(--chart4); cursor: default; }
.mac .top { display: flex; align-items: center; justify-content: flex-start; gap: 7px; font-weight: 600; font-size: 14px; }
.mac .top span { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mac .w { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin-top: 6px; }
.mac .w small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.mac .sub { color: var(--faint); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#fleetSum { color: var(--faint); font-size: 13px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--chart3); flex: none; }
.dot.live { background: var(--accent); } .dot.wait { background: var(--warning); } .dot.off { background: var(--negative); }

.title { padding: 18px 2px 14px; }
.title .row { align-items: baseline; flex-wrap: wrap; }
.title h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
#spec { color: var(--faint); font-size: 13px; }
#finding { font-size: 15px; margin-top: 6px; color: var(--muted); text-wrap: pretty; }

/* Cards. On a phone they stack; from 900 px the two columns sit side by side, as in the app. */
main { display: flex; flex-direction: column; gap: var(--gap); }
.col { display: contents; }
#powerCard { order: 1; } #gridCard { order: 2; } #fanCard { order: 3; } #procCard { order: 4; } #appsCard { order: 5; } #asleep { order: 0; }
.card { background: var(--surface); border-radius: 16px; padding: 16px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h2 { font-size: 15px; font-weight: 600; }
.tabs { display: flex; gap: 14px; }
.tabs button { font-size: 14px; color: var(--faint); padding: 4px 0; border-bottom: 1.5px solid transparent; }
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--text); font-weight: 600; border-color: var(--text); }

.big { font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.05; }
.big small { font-size: 17px; font-weight: 400; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.stats { text-align: right; font-size: 14px; color: var(--muted); }
.stats b { color: var(--text); font-weight: 600; margin-left: 8px; }
.stats div + div { margin-top: 4px; }
#battery { color: var(--muted); font-size: 13px; margin-top: 8px; }
#battery:empty { display: none; }
#chart { display: block; width: 100%; height: 172px; margin: 16px 0 14px; touch-action: pan-y; cursor: crosshair; }

.bar { position: relative; height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .4s ease; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 22px; margin-top: 12px; font-size: 14px; }
.legend div { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.legend b { margin-left: auto; color: var(--text); font-weight: 600; }
.sw { width: 9px; height: 9px; border-radius: 2px; flex: none; }

.grid { display: grid; grid-template-columns: 1fr 1fr; padding: 0; }
.cell { padding: 14px; min-height: 134px; min-width: 0; border-bottom: 1px solid var(--line); }
.cell:nth-child(odd) { border-right: 1px solid var(--line); }
.cell:nth-last-child(-n+2) { border-bottom: 0; }
.cell .row { min-height: 24px; }
.label { color: var(--muted); font-size: 14px; }
.mid { font-size: 28px; font-weight: 500; letter-spacing: -0.02em; margin: 6px 0 10px; white-space: nowrap; }
.mid small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 3px; letter-spacing: 0; }
.note { color: var(--faint); font-size: 12.5px; margin-top: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note + .note { margin-top: 1px; }
.pill { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--raised); color: var(--text); white-space: nowrap; }
.pill.good { background: #222a10; color: var(--accent); }
.pill.warn { background: #2b2414; color: var(--warning); }
.pill.bad { background: #2c1a20; color: var(--negative); }
.cores { display: flex; align-items: flex-end; gap: 2px; height: 38px; margin-top: 2px; }
.cores i { flex: 1; height: 100%; background: var(--raised); border-radius: 2px; position: relative; overflow: hidden; }
.cores i b { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); transition: height .4s ease; }
.cores .gap { flex: 0 0 5px; background: none; }
.io { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; margin-top: 10px; font-size: 14px; }
.io span { color: var(--muted); } .io b { text-align: right; font-weight: 500; }

.fan { margin-top: 18px; }
.fan .rpm { font-size: 24px; font-weight: 500; }
.fan .rpm small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.fan .bar { margin-top: 12px; }
.scale { display: flex; justify-content: space-between; color: var(--faint); font-size: 12px; margin-top: 6px; }
.slider { position: relative; margin-top: 4px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; display: block; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--raised); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: var(--text); box-shadow: inset 0 0 0 9px var(--text), inset 0 0 0 13px var(--ground); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--raised); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: var(--text); }
#fanNote { color: var(--muted); font-size: 14px; margin-top: 16px; }
#fanErr { color: var(--negative); font-size: 14px; margin-top: 8px; }
#fanErr:empty { display: none; }

.procs .head, .cols { display: grid; grid-template-columns: 72px 64px; gap: 8px; text-align: right; color: var(--faint); font-size: 13px; }
.proc { display: grid; grid-template-columns: 1fr 72px 64px; gap: 8px; align-items: baseline; padding: 10px 0 6px; border-bottom: 1px solid var(--line); font-size: 15px; }
.proc:last-child { border-bottom: 0; }
.proc span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proc b { text-align: right; font-weight: 500; }
.proc .use { grid-column: 1 / -1; height: 2px; border-radius: 1px; background: var(--chart2); margin-top: -2px; transition: width .4s ease; }
.empty { color: var(--faint); font-size: 14px; padding: 8px 0 2px; }

#asleep { display: none; text-align: center; padding: 40px 24px; }
#asleep .moon { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 50%; box-shadow: inset -10px -8px 0 0 var(--chart3); transform: rotate(-20deg); }
#asleep h2 { font-size: 17px; }
#asleep p { color: var(--muted); font-size: 14px; margin-top: 6px; }
body.away #asleep { display: block; }
body.away #powerCard, body.away #gridCard, body.away #fanCard, body.away #procCard, body.away #appsCard { display: none; }

footer { display: flex; justify-content: space-between; gap: 12px; color: var(--faint); font-size: 13px; padding: 14px 2px 0; }

/* Tap a card for its history. */
.tap { cursor: pointer; transition: background .15s; }
.tap:hover { background: #191b1f; }
.tap:active { background: #1c1e22; }
.more { font-style: normal; color: var(--chart3); margin-left: 5px; }
.link { color: var(--muted); font-size: 14px; }
.link:hover { color: var(--text); }

dialog.sheet { border: 0; padding: 0; margin: 0; width: 100%; max-width: 100%; height: 100dvh; max-height: 100dvh;
  background: var(--ground); color: var(--text); overscroll-behavior: contain; }
dialog.sheet:focus { outline: none; }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .6); }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; background: var(--ground); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 17px; }
#done { font-weight: 600; padding: 6px 2px; }
.sheet-body { display: flex; flex-direction: column; gap: 12px; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
#dSub { color: var(--muted); font-size: 14px; margin-top: 8px; }
#dSub:empty { display: none; }
#dChart { display: block; width: 100%; height: 190px; margin: 14px 0 6px; touch-action: pan-y; cursor: crosshair; }
html.locked { overflow: hidden; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; margin-top: 12px; font-size: 15px; }
.kv span { color: var(--muted); } .kv b { text-align: right; font-weight: 500; }
.srow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; padding: 10px 0 6px; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow b { font-weight: 500; }
.srow .use { grid-column: 1 / -1; height: 2px; border-radius: 1px; background: var(--chart2); margin-top: -2px; }
.srow.sub { padding: 6px 0 4px 14px; font-size: 14px; color: var(--muted); border: 0; }
.srow.sub .use { background: var(--chart3); }
.pillbtn { font-size: 13px; font-weight: 600; border-radius: 999px; padding: 5px 12px; background: var(--raised); }
.pillbtn:hover:not(:disabled) { background: #2e3238; }
.pillbtn:disabled { color: var(--faint); cursor: default; }
/* Apps: quit takes two taps, so a stray one never closes anything. */
.app { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 9px 0; border-bottom: 1px solid var(--line); text-align: left; }
.app:last-child { border-bottom: 0; }
.app img { width: 32px; height: 32px; }
.app .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .sub { color: var(--faint); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pillbtn.ask { background: var(--negative); color: var(--ground); }
.pillbtn.ask:hover { background: var(--negative); }
#appsErr, #pErr { color: var(--negative); font-size: 14px; margin-top: 8px; }
#appsErr:empty, #pErr:empty { display: none; }
.apps-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 2px; }
#appsSum { color: var(--faint); font-size: 13px; }
.recent { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.recent h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.ev { display: grid; grid-template-columns: 1fr auto; gap: 12px; color: var(--faint); font-size: 13px; }
.ev + .ev { margin-top: 5px; }
.ev span:last-child { white-space: nowrap; }
.ev.bad span:first-child { color: var(--warning); }
/* ---------- Actions: saved commands, one per row; Run takes two taps, like Quit ---------- */
#actionsCard { order: 6; }
body.away #actionsCard { display: none; }
.act { padding: 9px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act .sub { display: flex; gap: 6px; color: var(--faint); font-size: 13px; white-space: nowrap; }
.act .sub > span:first-child { overflow: hidden; text-overflow: ellipsis; }      /* the result shortens; Output stays */
.act .sub .link { font-size: 13px; flex: none; }
.act .ok { color: var(--accent); } .act .bad { color: var(--negative); }
.pillbtn.go, .pillbtn.go:hover { background: var(--accent); color: var(--ground); }
.out { margin-top: 8px; max-height: 260px; overflow: auto; background: var(--ground); border-radius: 10px; padding: 10px 12px;
  font: 12px/1.45 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--chart2); }
#actionsErr { color: var(--negative); font-size: 14px; margin-top: 8px; }
#actionsErr:empty { display: none; }
/* ---------- end Actions ---------- */
a.pillbtn { display: inline-block; color: var(--text); text-decoration: none; margin-top: 12px; }
#screenBtn { margin-top: 0; }
input[type=search] { width: 100%; height: 40px; border: 0; border-radius: 10px; background: var(--raised); color: var(--text); font: inherit; font-size: 16px; padding: 0 12px; }
input[type=search]:focus { outline: 2px solid var(--chart3); }
.cores.tall { height: 84px; gap: 3px; margin-top: 12px; }
.fine { color: var(--faint); font-size: 13px; margin-top: 10px; }

@media (min-width: 900px) {
  dialog.sheet { width: 760px; height: auto; max-height: 88vh; margin: auto; border-radius: 18px; border: 1px solid var(--line); }
  .sheet-head { padding-top: 14px; }
  .sheet-body { padding: 20px; }
  #dChart { height: 230px; }
}
@media (min-width: 900px) {
  body { max-width: 1160px; padding: 0 32px 32px; }
  .brand, #stamp { height: 68px; }
  .top { flex-wrap: nowrap; border-bottom: 1px solid var(--line); margin: 0 -32px; padding: 0 32px; }
  .hosts { order: 0; flex: 0 0 auto; margin: 0 0 0 auto; }
  .hosts button { height: 32px; padding: 0 16px; }
  .title { padding: 22px 2px 18px; }
  #fleetCard { grid-column: 1 / -1; }
  .title h1 { font-size: 30px; }
  #finding { font-size: 16px; }
  :root { --gap: 16px; }
  main { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  .col { display: flex; flex-direction: column; gap: var(--gap); }
  .card { padding: 20px; }
  .cell { padding: 16px 18px; }
  #chart { height: 210px; }
  body.away main { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.png" alt="">Vitals</div>
  <nav class="seg hosts" id="hosts" aria-label="Mac"></nav>
  <div id="stamp">Connecting…</div>
</header>

<section class="title">
  <div class="row"><h1 id="name">Vitals</h1><span id="spec"></span></div>
  <p id="finding">Connecting…</p>
</section>

<main>
  <section class="card" id="fleetCard" hidden>
    <div class="row"><h2>Your Macs</h2><span id="fleetSum"></span></div>
    <div class="fleet" id="fleet"></div>
  </section>
  <div class="col">
    <section class="card" id="asleep"><div class="moon"></div><h2 id="asleepTitle">Asleep</h2><p id="asleepNote"></p></section>
    <section class="card" id="powerCard">
      <div class="row"><h2>Power</h2>
        <div class="tabs" id="ranges"><button>10 m</button><button>1 h</button><button>24 h</button><button>14 d</button></div>
      </div>
      <div class="row" style="margin-top:14px;align-items:flex-end">
        <div class="big"><span id="watts">—</span><small>W</small></div>
        <div class="stats"><div><span>Today</span><b id="today">—</b></div><div><span id="peakL">Peak · 1 h</span><b id="peak">—</b></div></div>
      </div>
      <div id="battery"></div>
      <canvas id="chart" aria-label="Power over time"></canvas>
      <div class="bar" id="split"></div>
      <div class="legend" id="legend"></div>
    </section>
    <section class="card" id="fanCard">
      <div class="row"><div><h2 id="fanTitle" style="display:inline">Fan</h2> <button class="link" data-detail="fan">History<i class="more">›</i></button></div>
        <div class="seg" id="modes" style="width:216px"><button data-m="auto">Auto</button><button data-m="fixed">Fixed</button><button data-m="curve">Curve</button></div>
      </div>
      <div id="fans"></div>
      <p id="fanNote"></p>
      <p id="fanErr"></p>
    </section>
  </div>
  <div class="col">
    <section class="card grid" id="gridCard">
      <div class="cell tap" id="cpu" data-detail="cpu"></div><div class="cell tap" id="mem" data-detail="mem"></div>
      <div class="cell tap" id="therm" data-detail="therm"></div><div class="cell tap" id="gpu" data-detail="gpu"></div>
      <div class="cell tap" id="disk" data-detail="disk"></div><div class="cell" id="net"></div>
    </section>
    <section class="card procs" id="procCard">
      <div class="row"><h2>Using the CPU now</h2><div class="head"><span>CPU</span><span>Memory</span></div></div>
      <div id="procs"></div>
    </section>
    <section class="card" id="appsCard" hidden>
      <div class="row"><h2 id="appsTitle">Apps</h2><div style="display:flex;gap:8px"><a class="pillbtn" id="screenBtn" href="screen/" hidden>Screen<i class="more">›</i></a><button class="pillbtn" id="openApp">Open…</button></div></div>
      <div class="apps-meta" id="appsMeta"><span id="appsSum"></span>
        <div class="tabs" id="appSort" aria-label="Sort apps by"><button data-k="mem">Memory</button><button data-k="cpu">CPU</button></div></div>
      <p id="appsErr" role="alert"></p>
      <div id="apps"></div>
    </section>
    <!-- Actions: saved commands, defined on the Mac with `vitals-agent action add` (Actions.swift) -->
    <section class="card" id="actionsCard" hidden>
      <div class="row"><h2 id="actionsTitle">Actions</h2></div>
      <p id="actionsErr" role="alert"></p>
      <div id="actions"></div>
    </section>
    <!-- end Actions -->
  </div>
</main>
<dialog id="sheet" class="sheet" aria-labelledby="dTitle" autofocus tabindex="-1">
  <div class="sheet-head"><h2 id="dTitle"></h2><button id="done">Done</button></div>
  <div class="sheet-body">
    <section class="card">
      <div class="row" style="align-items:flex-end"><div class="big" id="dNow">—</div>
        <div class="tabs" id="dRanges"><button>1 h</button><button>24 h</button><button>14 d</button></div></div>
      <p id="dSub"></p>
      <canvas id="dChart"></canvas>
      <div class="legend" id="dLegend"></div>
    </section>
    <div id="dExtra" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</dialog>
<dialog id="picker" class="sheet" aria-labelledby="pTitle" tabindex="-1">
  <div class="sheet-head"><h2 id="pTitle">Open an app</h2><button id="pDone" style="font-weight:600;padding:6px 2px">Done</button></div>
  <div class="sheet-body">
    <input id="pSearch" type="search" placeholder="Search apps" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Search apps">
    <p id="pErr"></p>
    <section class="card" id="pList" style="padding-top:6px;padding-bottom:6px"></section>
  </div>
</dialog>
<footer><span id="foot"></span><span>Samples only while this page is open</span></footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const RANGES = ['10m', '1h', '24h', '14d'], LABELS = ['10 m', '1 h', '24 h', '14 d'];
const CEILING = 95, CURVE = [50, 85];
// "here" is the Mac serving this page; the peers are your other Macs, found through Tailscale (/fleet) and
// read straight from their own addresses. `key` is a Mac's tailnet name ("here" for this one).
const blank = (base, key) => ({ key, base, info: null, snap: null, live: [], state: 'idle', seen: 0, hist: {}, es: null });
const st = { host: store.get('host', 'here'), range: +store.get('range', 1), here: blank('', 'here'), peers: [],
             pending: null, dragging: false, err: '' };
if (!(st.range >= 0 && st.range <= 3)) st.range = 1;
// What each Mac was last seen as, so a sleeping one still has a name and a "last seen".
const fleetSeen = (() => { try { return JSON.parse(store.get('fleet', '{}')) || {}; } catch { return {}; } })();
function remember(h) { if (h === st.here) return; fleetSeen[h.key] = { info: h.info, seen: h.seen, name: h.name }; store.set('fleet', JSON.stringify(fleetSeen)); }
function peerFor(m) {
  let p = st.peers.find(x => x.key === m.host);
  if (!p) {
    p = blank(m.url, m.host);
    const c = fleetSeen[m.host]; if (c) { p.info = c.info; p.seen = c.seen || 0; p.vitals = true; }
    st.peers.push(p);
  }
  p.base = m.url; p.name = m.name; p.online = m.online;
  return p;
}
const isPeer = h => h !== st.here;

// ---------- formatting (the app's Fmt) ----------
const F = {
  watts: w => w == null ? '—' : w < 100 ? w.toFixed(1) : w.toFixed(0),
  wu: w => w == null ? '—' : F.watts(w) + ' W',
  energy: wh => wh < 1000 ? Math.round(wh) + ' Wh' : (wh / 1000).toFixed(2) + ' kWh',
  gb: (b, d = 1) => (b / 1073741824).toFixed(d),
  mem: b => b < 1073741824 ? Math.round(b / 1048576) + ' MB' : (b / 1073741824).toFixed(1) + ' GB',
  rate: b => b == null ? '—' : b < 1e3 ? Math.round(b) + ' B/s' : b < 1e6 ? Math.round(b / 1e3) + ' KB/s' : b < 1e9 ? (b / 1e6).toFixed(1) + ' MB/s' : (b / 1e9).toFixed(2) + ' GB/s',
  size: b => b >= 1e12 ? (b / 1e12).toFixed(2) + ' TB' : b >= 1e11 ? Math.round(b / 1e9) + ' GB' : (b / 1e9).toFixed(1) + ' GB',
  temp: t => t == null ? '—' : Math.round(t) + '°',
  pct: p => p == null ? '—' : Math.round(p) + '%',
  rpm: r => Math.round(r).toLocaleString('en-US'),
  dur: s => { const m = Math.floor(s / 60), d = Math.floor(m / 1440), h = Math.floor(m / 60) % 24;
              return d > 0 ? `${d} d ${h} h` : h > 0 ? `${h} h ${m % 60} m` : `${m} m`; },
  clock: (t, sec) => new Date(t * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: sec ? '2-digit' : undefined }),
  day: d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`,
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Tailscale's name for it ("Mac mini", "MacBook"; tailnet names when two would read the same), else the model.
const shortName = h => h.name || h.info?.model?.split(' (')[0] || (h === st.here ? 'This Mac' : guessName(h.base));
/** Before the other Mac has ever answered: a name from its tailnet address, e.g. "MacBook" from shmulis-macbook-pro-2. */
const guessName = url => { const n = (url || '').toLowerCase();
  return n.includes('macbook') ? 'MacBook' : n.includes('mini') ? 'Mac mini' : n.includes('studio') ? 'Mac Studio' : n.includes('imac') ? 'iMac' : 'Other Mac'; };
const cur = () => st.host === 'here' ? st.here : st.peers.find(p => p.key === st.host) || st.here;
const macs = () => [st.here, ...st.peers.filter(p => p.vitals)];
const bootOf = s => s?.volumes?.find(v => v.boot) || s?.volumes?.[0];
const now = () => Date.now() / 1000;

// ---------- data ----------
// Only the Mac on screen streams, and only while the page is visible: that Mac samples once a second
// while someone looks and not at all otherwise.
function took(h, s) {
  h.snap = s; h.seen = s.t; h.state = 'live';
  h.live.push({ t: s.t, w: s.wSystem, cpu: s.cpu, gpu: s.gpu, temp: s.tCPU, fan: s.fans[0]?.rpm,
                mem: s.memUsed, swap: s.swapUsed, free: bootOf(s)?.free });
  while (h.live.length && s.t - h.live[0].t > 900) h.live.shift();
  if (isPeer(h) && s.t - (fleetSeen[h.key]?.seen || 0) > 60) remember(h);
}

function open(h) {
  if (h.es || h.base == null) return;
  if (h.state !== 'live') h.state = 'wait';
  const es = h.es = new EventSource(h.base + 'events');
  es.addEventListener('info', e => { h.info = JSON.parse(e.data); h.vitals = true; remember(h); render(); });
  es.onmessage = e => { took(h, JSON.parse(e.data)); render(); };
  es.onerror = () => { if (now() - h.seen > 6) h.state = isPeer(h) ? 'off' : 'wait'; render(); };
}
function shut(h) { if (h.es) { h.es.close(); h.es = null; } if (h.state === 'live') h.state = 'idle'; }
function connect() {
  const c = cur();
  for (const h of [st.here, ...st.peers]) if (h !== c) shut(h);
  if (document.hidden) shut(c); else open(c);
}

async function loadHistory(range = st.range) {
  const h = cur(), key = RANGES[range === 0 ? 1 : range];
  if (h.base == null) return;
  try {
    const r = await fetch(`${h.base}history?range=${key}`, { cache: 'no-store' });
    if (r.ok) { h.hist[key] = await r.json(); render(); }
  } catch {}
}

async function setFan(policy) {
  st.pending = { policy, until: Date.now() + 5000 };
  st.err = '';
  render();
  try {
    const r = await fetch('fan', { method: 'POST', headers: { 'X-Vitals': '1' }, body: policy });
    if (!r.ok) { st.err = (await r.json().catch(() => ({}))).error || 'The Mac refused the change.'; st.pending = null; }
  } catch { st.err = 'The Mac did not answer.'; st.pending = null; }
  render();
}

// ---------- the finding (Dashboard.finding) ----------
function finding(h) {
  const s = h.snap;
  if (h.state === 'off') return [`${shortName(h)} is asleep or off Tailscale.`, 'var(--muted)'];
  if (!s) return [`Connecting to ${shortName(h) === 'This Mac' ? 'this Mac' : shortName(h)}…`, 'var(--muted)'];
  const top = s.procs?.[0]?.name;
  const boot = s.volumes?.find(v => v.boot);
  if (s.thermal >= 2) return [`Thermal pressure is ${s.thermal === 2 ? 'serious' : 'critical'}: macOS is slowing the chip to cool it.`, 'var(--negative)'];
  if (boot && (boot.free < 8e9 || boot.free / Math.max(1, boot.total) < 0.05)) return [`Storage is almost full: ${F.size(boot.free)} free of ${F.size(boot.total)} on ${esc(boot.name)}.`, 'var(--negative)'];
  if (s.pressure >= 4) return [`Memory pressure is critical: ${F.gb(s.swapUsed)} GB is in swap and apps are being squeezed.`, 'var(--negative)'];
  if (s.tCPU >= 90) {
    const fans = s.fans.length ? ` with fans at ${F.rpm(Math.max(...s.fans.map(f => f.rpm)))} rpm` : '';
    return [`CPU at ${F.temp(s.tCPU)}${fans}` + (top ? `; ${esc(top)} is the main load.` : '.'), 'var(--warning)'];
  }
  if (s.pressure >= 2) return [`Memory is the pressure point: ${F.gb(s.memUsed)} of ${F.gb(s.memTotal, 0)} GB used, ${F.gb(s.swapUsed)} GB in swap.`, 'var(--warning)'];
  if (s.cpu >= 70) return [`CPU is busy at ${F.pct(s.cpu)}` + (top ? `; ${esc(top)} is using the most.` : '.'), 'var(--text)'];
  if (s.battery && !s.battery.external) {
    const left = s.battery.minutesLeft != null ? ` · ${F.dur(s.battery.minutesLeft * 60)} left at this rate` : '';
    return [`On battery at ${Math.round(s.battery.percent)}%${left}.`, 'var(--text)'];
  }
  const fan = s.fans[0] ? `, fan at ${F.rpm(s.fans[0].rpm)} rpm` : '';
  return [`Running easy: ${F.wu(s.wSystem)}, CPU ${F.temp(s.tCPU)}${fan}.`, 'var(--muted)'];
}
function ago(t) {
  const s = now() - t;
  if (s < 90) return 'just now';
  if (s < 86400 && new Date(t * 1000).getDate() === new Date().getDate()) return 'at ' + F.clock(t);
  return F.dur(s) + ' ago';
}

// ---------- render ----------
function render() {
  const h = cur(), away = h.state === 'off';
  const s = away ? null : h.snap;
  document.body.classList.toggle('away', away);

  // Green when streaming, or when its last minute came in (a Mac you just left stays green).
  const all = macs(), dotOf = x => 'dot ' + (x.state === 'off' ? 'off' : x.state === 'wait' ? 'wait'
    : x.state === 'live' || x.state === 'up' || x.sum ? 'live' : '');
  const nav = all.map(x => `<button data-h="${esc(x.key)}" class="${x === h ? 'on' : ''}"><i class="${dotOf(x)}"></i><span>${esc(shortName(x))}</span></button>`).join('');
  if (nav !== lastNav) { $('hosts').innerHTML = nav; lastNav = nav; }
  $('hosts').style.display = all.length > 1 ? '' : 'none';
  fleetCard(all, dotOf);
  $('stamp').textContent = h.state === 'live' && s ? 'Live · ' + F.clock(s.t, true) : away ? 'Asleep' : 'Connecting…';
  $('name').textContent = shortName(h);
  const i = h.info;
  $('spec').textContent = i ? `${i.chip.replace('Apple ', '')} · ${i.cores} cores · ${F.gb(i.memory, 0)} GB · ${i.os}` : '';
  const [line, tone] = finding(h);
  $('finding').innerHTML = line; $('finding').style.color = tone;
  $('asleepTitle').textContent = `${shortName(h)} is asleep`;
  $('asleepNote').textContent = (h.seen ? `Last seen ${ago(h.seen)}. ` : '') + 'It shows up here again as soon as it wakes and joins Tailscale.';

  power(h, s);
  cells(s);
  fanCard(h, s);
  procs(s);
  renderApps();
  renderActions();
  renderDetail();
  $('foot').textContent = s ? `Up ${F.dur(s.uptime)} · load ${s.load.map(l => l.toFixed(1)).join(' / ')}` : '';
}

let lastNav = '', lastFleet = '';
/** One tile per Mac: live numbers for the one on screen, the last logged minute for the rest. */
function fleetCard(all, dotOf) {
  const none = st.peers.filter(p => p.vitals === false);
  $('fleetCard').hidden = all.length + none.length < 2;
  if ($('fleetCard').hidden) return;
  let total = 0, counted = 0;
  const tile = x => {
    const live = x.snap && x.state === 'live', m = x.sum || {}, mem = x.info?.memory;
    const w = live ? x.snap.wSystem : x.state === 'off' ? null : m.w, cpu = live ? x.snap.cpu : m.cpu, t = live ? x.snap.tCPU : m.temp;
    const used = live ? x.snap.memUsed : m.mem;
    if (w != null) { total += w; counted++; }
    const sub = x.state === 'off' ? ['Asleep or off Tailscale', x.seen ? `Last seen ${ago(x.seen)}` : '']
      : [[cpu != null && `CPU ${F.pct(cpu)}`, t != null && F.temp(t)].filter(Boolean).join(' · ') || '…',
         used != null && mem ? `${F.gb(used, 0)} of ${F.gb(mem, 0)} GB used` : ''];
    // What needs attention, said on the tile itself: a hot CPU, or a drive about to fill up.
    const free = live ? bootOf(x.snap)?.free : m.free;
    const alert = x.state === 'off' ? '' : free != null && free < 8e9 ? `<div class="sub" style="color:var(--negative)">Storage almost full: ${F.size(free)} free</div>`
      : t >= 90 ? `<div class="sub" style="color:var(--warning)">Running hot</div>` : '';
    return `<button class="mac${x === cur() ? ' on' : ''}" data-h="${esc(x.key)}"><div class="top"><i class="${dotOf(x)}"></i><span>${esc(shortName(x))}</span></div>
      <div class="w">${x.state === 'off' ? '—' : F.watts(w)}<small>W</small></div>${sub.map(l => `<div class="sub">${esc(l)}</div>`).join('')}${alert}</button>`;
  };
  const html = all.map(tile).join('') + none.map(p => `<div class="mac none"><div class="top"><span>${esc(shortName(p))}</span></div>
      <div class="sub" style="white-space:normal;margin-top:6px">No Vitals here yet. Set up its dashboard and it joins this list.</div></div>`).join('');
  if (html !== lastFleet) { $('fleet').innerHTML = html; lastFleet = html; }
  $('fleetSum').textContent = `${all.length} Mac${all.length > 1 ? 's' : ''}` + (counted ? ` · ${F.wu(total)} together` : '');
}
$('fleet').addEventListener('click', e => { const b = e.target.closest('[data-h]'); if (b && b.dataset.h !== st.host) pick(b.dataset.h); });

function power(h, s) {
  [...$('ranges').children].forEach((b, i) => b.classList.toggle('on', i === st.range));
  $('watts').textContent = F.watts(s?.wSystem);
  const hist = h.hist[RANGES[st.range === 0 ? 1 : st.range]];
  const days = hist?.days || [];
  const today = days.find(d => d.day === F.day(new Date()));
  $('today').textContent = today ? F.energy(today.wh) : '—';
  if (st.range === 3) {
    $('peakL').textContent = '14 days'; $('peak').textContent = days.length ? F.energy(days.reduce((a, d) => a + d.wh, 0)) : '—';
  } else {
    const { pts, from } = seriesOf(h, 'w', st.range);
    const peak = Math.max(-1, ...(hist?.rows || []).filter(r => r.t >= from).map(r => r.wMax), ...pts.map(p => p.v));
    $('peakL').textContent = 'Peak · ' + LABELS[st.range]; $('peak').textContent = peak >= 0 ? F.wu(peak) : '—';
  }
  const b = s?.battery;
  $('battery').textContent = b ? `Battery ${Math.round(b.percent)}%` + (b.charging ? ' · charging' : b.external ? ' · on power' : ' · on battery')
    + (b.inWatts != null ? ` · ${F.wu(b.inWatts)} from the adapter` : '') + (b.health != null ? ` · ${Math.round(b.health)}% health` : '') : '';

  // Where the watts go. Chips that leave a counter at zero get a dash, not a made-up 0 W.
  const parts = [['CPU', s?.wCPU, 'var(--accent)'], ['GPU', s?.wGPU, 'var(--chart2)'], ['Memory', s?.wDRAM, 'var(--chart3)']];
  const known = parts.reduce((a, p) => a + (p[1] || 0), 0);
  parts.push(['Other', s?.wSystem != null ? Math.max(0, s.wSystem - known) : null, 'var(--chart4)']);
  const total = Math.max(1e-6, s?.wSystem || 0);
  $('split').innerHTML = parts.map(p => `<i style="width:${(p[1] || 0) / total * 100}%;background:${p[2]}"></i>`).join('');
  $('legend').innerHTML = parts.map(p => `<div><i class="sw" style="background:${p[2]}"></i>${p[0]}<b>${F.wu(p[0] !== 'Other' && !p[1] ? null : p[1])}</b></div>`).join('');
  drawChart(h);
}

/** One metric for a range, oldest first: logged rows (centred in their bucket), then the live readings after them. */
function seriesOf(h, key, range) {
  const end = h.snap?.t ?? now();
  const span = [600, 3600, 86400, 86400 * 14][range], from = end - span;
  const hist = h.hist[RANGES[range === 0 ? 1 : range]];
  const mid = [30, 30, 150, 1800][range];
  const pts = (hist?.rows || []).filter(r => r.t >= from && r[key] != null).map(r => ({ t: r.t + mid, v: r[key] }));
  const last = pts.length ? pts[pts.length - 1].t : from;
  const live = h.live.filter(p => p.t > last + 30 && p.t >= from && p[key] != null).map(p => ({ t: p.t, v: p[key] }));
  return { pts: pts.concat(live), from, end };
}

function nice(max) {
  const raw = Math.max(max, 1) / 2, mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw);
}
const when = (t, range) => range === 3 ? new Date(t * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : F.clock(t);

function canvas(c) {
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
  if (!W) return null;
  if (c.width !== Math.round(W * dpr) || c.height !== Math.round(H * dpr)) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.font = '12px -apple-system, system-ui, sans-serif';
  const P = { x0: 0, x1: W - 54, y0: 6, y1: H - 22 };
  P.w = P.x1 - P.x0; P.h = P.y1 - P.y0;
  const msg = text => { g.fillStyle = '#8f9296'; g.textAlign = 'center'; g.fillText(text, P.w / 2, P.h / 2 + 6); };
  const grid = (step, label) => {
    g.strokeStyle = '#23262b'; g.lineWidth = 1; g.fillStyle = '#8f9296'; g.textAlign = 'right';
    for (let k = 0; k <= 2; k++) {
      const y = Math.round(P.y1 - k / 2 * P.h) + 0.5;
      g.beginPath(); g.moveTo(P.x0, y); g.lineTo(P.x1, y); g.stroke();
      g.fillText(label(step * k), W, y + 4);
    }
  };
  return { g, W, H, P, msg, grid };
}

/** Line chart: a two-step grid, time labels, one or more series, and the reading under the finger or pointer. */
function plot(c, { lines, from, end, range, top, axis, fmt, empty }) {
  const k = canvas(c);
  if (!k) return;
  const { g, W, H, P, msg, grid } = k, span = end - from;
  const step = top ? top / 2 : nice(Math.max(0, ...lines.flatMap(l => l.pts.map(p => p.v))) * 1.05), tp = step * 2;
  grid(step, axis);
  for (let i = 0; i <= 3; i++) {
    const t = from + span * i / 3, x = P.x0 + P.w * i / 3;
    g.textAlign = i === 0 ? 'left' : i === 3 ? 'right' : 'center';
    g.fillText(i === 3 ? 'now' : range === 0 ? `−${Math.round((end - t) / 60)} m` : when(t, range), x, H - 4);
  }
  if (!lines.some(l => l.pts.length > 1)) return msg(empty);
  const px = t => P.x0 + (t - from) / span * P.w, py = v => P.y1 - Math.min(Math.max(v, 0), tp) / tp * P.h;
  const gap = [120, 180, 900, 10800][range];
  for (const l of lines) {
    const runs = [[]];
    l.pts.forEach((p, i) => { if (i && p.t - l.pts[i - 1].t > gap) runs.push([]); runs[runs.length - 1].push(p); });
    const fill = g.createLinearGradient(0, P.y0, 0, P.y1);
    fill.addColorStop(0, 'rgba(198,242,78,0.22)'); fill.addColorStop(1, 'rgba(198,242,78,0.02)');
    for (const run of runs) {
      if (!run.length) continue;
      g.beginPath();
      run.forEach((p, i) => i ? g.lineTo(px(p.t), py(p.v)) : g.moveTo(px(p.t), py(p.v)));
      g.strokeStyle = l.color; g.lineWidth = 1.6; g.lineJoin = 'round'; g.stroke();
      if (l.fill) { g.lineTo(px(run[run.length - 1].t), P.y1); g.lineTo(px(run[0].t), P.y1); g.closePath(); g.fillStyle = fill; g.fill(); }
    }
  }
  const pts = lines[0].pts;
  if (c.hoverX != null && c.hoverX <= P.x1 && pts.length) {
    const t = from + (c.hoverX - P.x0) / P.w * span;
    const near = pts.reduce((a, p) => Math.abs(p.t - t) < Math.abs(a.t - t) ? p : a);
    const x = px(near.t), y = py(near.v);
    g.strokeStyle = '#6b6b6b'; g.beginPath(); g.moveTo(Math.round(x) + 0.5, P.y0); g.lineTo(Math.round(x) + 0.5, P.y1); g.stroke();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 3.5, 0, 7); g.fill();
    const label = `${range === 3 ? when(near.t, 3) + ' ' + F.clock(near.t) : F.clock(near.t, range === 0)} · ${fmt(near.v)}`;
    g.font = '600 12px -apple-system, system-ui, sans-serif';
    const tw = g.measureText(label).width + 16, lx = Math.min(Math.max(x - tw / 2, 0), P.x1 - tw);
    g.fillStyle = '#24272c'; g.beginPath(); g.roundRect(lx, P.y0, tw, 22, 11); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.fillText(label, lx + tw / 2, P.y0 + 15);
  }
}

function drawChart(h) {
  const c = $('chart');
  if (st.range === 3) return dayBars(c, h);
  const { pts, from, end } = seriesOf(h, 'w', st.range);
  plot(c, { lines: [{ pts, color: '#c6f24e', fill: true }], from, end, range: st.range,
            axis: v => `${+v.toFixed(1)} W`, fmt: v => F.watts(v) + ' W',
            empty: st.range === 0 ? 'Collecting the first readings…' : 'The log fills from the first minute the agent ran.' });
}

function dayBars(c, h) {
  const k = canvas(c);
  if (!k) return;
  const { g, P, msg, grid } = k;
  const days = (h.hist['14d']?.days || []).slice(-14);
  if (!days.length) return msg('No days logged yet.');
  const step = nice(Math.max(...days.map(d => d.wh)) * 1.05), top = step * 2;
  grid(step, F.energy);
  const slots = 14, bw = (P.w - (slots - 1) * 4) / slots, today = F.day(new Date());
  days.forEach((d, i) => {
    const x = P.x0 + (slots - days.length + i) * (bw + 4), bh = Math.max(2, d.wh / top * P.h);
    g.fillStyle = d.day === today ? '#c6f24e' : '#6b6b6b';
    g.beginPath(); g.roundRect(x, P.y1 - bh, bw, bh, 2); g.fill();
    if (i === 0 || i === days.length - 1) {
      const [, m, dd] = d.day.split('-').map(Number);
      g.fillStyle = '#8f9296'; g.textAlign = i === 0 ? 'left' : 'right';
      g.fillText(d.day === today ? 'today' : new Date(2000, m - 1, dd).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), i === 0 ? x : x + bw, P.y1 + 18);
    }
  });
}

const bar = (frac, color = 'var(--chart2)') => `<div class="bar"><i style="width:${Math.max(0, Math.min(1, frac)) * 100}%;background:${color}"></i></div>`;
const pill = (text, kind = '') => `<span class="pill ${kind}">${text}</span>`;

function cells(s) {
  const dash = title => `<div class="row"><span class="label">${title}</span></div><div class="mid">—</div>`;
  if (!s) { [['cpu', 'CPU'], ['mem', 'Memory'], ['therm', 'Thermal'], ['gpu', 'GPU'], ['disk', 'Storage'], ['net', 'Network and disk']].forEach(([id, t]) => $(id).innerHTML = dash(t)); return; }

  const e = s.eCores, cores = s.cores.map((v, i) => (i === e && e > 0 ? '<i class="gap"></i>' : '') + `<i><b style="height:${Math.max(4, v)}%"></b></i>`).join('');
  $('cpu').innerHTML = `<div class="row"><span class="label">CPU<i class="more">›</i></span><span class="note" style="margin:0">load ${s.load[0]?.toFixed(1) ?? '—'}</span></div>
    <div class="mid">${F.pct(s.cpu)}</div><div class="cores">${cores}</div>
    <div class="note">${e ? `${e} E-cores · ${s.cores.length - e} P-cores` : `${s.cores.length} cores`}</div>`;

  const pr = s.pressure >= 4 ? pill('Critical', 'bad') : s.pressure >= 2 ? pill('Warning', 'warn') : pill('Normal');
  const used = s.memUsed, total = Math.max(1, s.memTotal);
  $('mem').innerHTML = `<div class="row"><span class="label">Memory<i class="more">›</i></span>${pr}</div>
    <div class="mid">${F.gb(used)}<small>/ ${F.gb(s.memTotal, 0)} GB</small></div>
    <div class="bar"><i style="width:${Math.max(0, used - s.memCompressed) / total * 100}%;background:var(--chart2)"></i><i style="width:${s.memCompressed / total * 100}%;background:var(--chart3)"></i></div>
    <div class="note">${F.gb(s.memCompressed)} GB compressed</div>
    <div class="note" style="color:${s.swapUsed > 1073741824 ? 'var(--warning)' : 'var(--faint)'}">Swap ${F.gb(s.swapUsed)} of ${F.gb(s.swapTotal)} GB</div>`;

  const th = [pill('Nominal'), pill('Fair', 'warn'), pill('Serious', 'bad'), pill('Critical', 'bad')][s.thermal] || '';
  const others = [s.tGPU != null && `GPU ${F.temp(s.tGPU)}`, s.tSSD != null && `SSD ${F.temp(s.tSSD)}`, s.battery?.temp != null && `Battery ${F.temp(s.battery.temp)}`].filter(Boolean);
  const hot = s.tCPU >= 90 ? 'var(--negative)' : s.tCPU >= 80 ? 'var(--warning)' : 'var(--chart2)';
  $('therm').innerHTML = `<div class="row"><span class="label">Thermal<i class="more">›</i></span>${th}</div>
    <div class="mid">${F.temp(s.tCPU)}<small>CPU</small></div>${bar(((s.tCPU ?? 30) - 30) / 75, hot)}
    <div class="note">${others.join(' · ') || '&nbsp;'}</div><div class="scale" style="margin-top:1px"><span>30°</span><span>105°</span></div>`;

  $('gpu').innerHTML = `<div class="row"><span class="label">GPU<i class="more">›</i></span></div>
    <div class="mid">${F.pct(s.gpu)}</div>${bar((s.gpu ?? 0) / 100)}
    <div class="note">drawing ${F.wu(s.wGPU)}</div><div class="note">Neural Engine ${F.wu(s.wANE)}</div>`;

  const boot = s.volumes.find(v => v.boot) || s.volumes[0];
  if (boot) {
    const share = boot.free / Math.max(1, boot.total);
    const flag = share < 0.05 || boot.free < 8e9 ? pill('Almost full', 'bad') : share < 0.12 ? pill('Low', 'warn') : '';
    const more = s.volumes.filter(v => v !== boot).map(v => `${esc(v.name)} ${F.size(v.free)} free`);
    $('disk').innerHTML = `<div class="row"><span class="label">Storage<i class="more">›</i></span>${flag}</div>
      <div class="mid">${F.size(boot.free).replace(' ', '<small>')} free</small></div>${bar(1 - share)}
      <div class="note">${F.size(boot.total - boot.free)} of ${F.size(boot.total)} used</div>
      <div class="note">${[esc(boot.name), ...more].join(' · ')}</div>`;
  } else $('disk').innerHTML = dash('Storage');

  $('net').innerHTML = `<div class="row"><span class="label">Network and disk</span></div>
    <div class="io"><span>in</span><b>${F.rate(s.netIn)}</b><span>out</span><b>${F.rate(s.netOut)}</b>
    <span>read</span><b>${F.rate(s.diskRead)}</b><span>write</span><b>${F.rate(s.diskWrite)}</b></div>`;
}

function policyOf(h, s) {
  if (h === st.here && st.pending) {
    if (Date.now() < st.pending.until && s?.fanPolicy !== st.pending.policy) return st.pending.policy;
    st.pending = null;
  }
  return s?.fanPolicy || 'auto';
}

function fanCard(h, s) {
  const fans = s?.fans || [];
  const control = h === st.here && !!s?.root;
  const policy = policyOf(h, s).split(' '), mode = policy[0];
  $('fanTitle').textContent = fans.length > 1 ? 'Fans' : 'Fan';
  for (const b of $('modes').children) { b.classList.toggle('on', b.dataset.m === mode); b.disabled = !control; }

  if (!st.dragging) {
    $('fans').innerHTML = !s ? '<p class="empty">—</p>' : !fans.length ? '<p class="empty">This Mac has no fans.</p>' : fans.map((f, n) => {
      const frac = (f.rpm - f.min) / Math.max(1, f.max - f.min);
      const right = f.manual ? `target ${F.rpm(f.target)}` : `${Math.round(Math.max(0, frac) * 100)}% of range`;
      const target = +policy[1] || f.target || f.min;
      const track = mode === 'fixed' && control
        ? `<div class="slider"><input type="range" min="${f.min}" max="${f.max}" step="50" value="${Math.min(f.max, Math.max(f.min, target))}" aria-label="Fan speed"></div>`
        : bar(Math.max(0.01, frac));
      return `<div class="fan"><div class="row"><span class="rpm">${F.rpm(f.rpm)}<small>rpm${fans.length > 1 ? (n ? ' · right' : ' · left') : ''}</small></span>
        <span class="label" data-target>${mode === 'fixed' && control ? `set to ${F.rpm(target)}` : right}</span></div>
        ${track}<div class="scale"><span>${F.rpm(f.min)}</span><span>${F.rpm(f.max)}</span></div></div>`;
    }).join('');
  }

  let note;
  if (isPeer(h)) note = `Read-only here. Change these fans from ${shortName(h)}’s own page or the Vitals app.`;
  else if (s && !s.root) note = 'Needs a one-time setup on this Mac: sudo ~/.vitals/vitals-agent setup-root';
  else if (mode === 'fixed') note = `Holds the speed you set; full speed above ${CEILING}°. Back to Auto when you close this page.`;
  else if (mode === 'curve') note = `Follows the CPU: minimum at ${policy[1] || CURVE[0]}°, full at ${policy[2] || CURVE[1]}°. Back to Auto when you close this page.`;
  else note = 'macOS is choosing the speed.';
  $('fanNote').textContent = note;
  $('fanErr').textContent = h === st.here ? st.err : '';
}

function procs(s) {
  const list = (s?.procs || []).slice(0, 6);
  if (!list.length) { $('procs').innerHTML = `<p class="empty">${s ? 'Gathering…' : '—'}</p>`; return; }
  const max = Math.max(1, ...list.map(p => p.cpu));
  $('procs').innerHTML = list.map(p => `<div class="proc"><span>${esc(p.name)}</span><b>${p.cpu.toFixed(1)}%</b><b>${F.gb(p.mem)} GB</b>
    <i class="use" style="width:${Math.max(2, p.cpu / max * 100)}%"></i></div>`).join('');
}

// ---------- input ----------
function pick(host) {
  st.host = host; store.set('host', host); $('chart').hoverX = null; if (st.detail) $('sheet').close();
  connect(); loadHistory(); loadApps(); render();
}
$('hosts').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.h !== st.host) pick(b.dataset.h); });
$('ranges').addEventListener('click', e => {
  const i = [...$('ranges').children].indexOf(e.target.closest('button'));
  if (i < 0) return;
  st.range = i; store.set('range', i); $('chart').hoverX = null; loadHistory(); render();
});
$('modes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const f = st.here.snap?.fans?.[0];
  if (b.dataset.m === 'fixed') setFan(`fixed ${f ? Math.max(f.min, Math.min(f.max, Math.round(f.rpm / 50) * 50)) : 2000}`);
  else if (b.dataset.m === 'curve') setFan(`curve ${CURVE[0]} ${CURVE[1]}`);
  else setFan('auto');
});
const fansEl = $('fans');
fansEl.addEventListener('pointerdown', e => { if (e.target.type === 'range') st.dragging = true; });
fansEl.addEventListener('input', e => {
  if (e.target.type !== 'range') return;
  st.dragging = true;
  e.target.closest('.fan').querySelector('[data-target]').textContent = `set to ${F.rpm(+e.target.value)}`;
});
fansEl.addEventListener('change', e => { if (e.target.type === 'range') { st.dragging = false; setFan(`fixed ${e.target.value}`); } });
document.addEventListener('pointerup', () => setTimeout(() => { st.dragging = false; }, 300));

function hoverable(c, redraw) {
  const set = e => { c.hoverX = e.clientX - c.getBoundingClientRect().left; redraw(); };
  c.addEventListener('pointerdown', set);
  c.addEventListener('pointermove', e => { if (c.hoverX != null || e.pointerType === 'mouse') set(e); });
  c.addEventListener('pointerleave', () => { c.hoverX = null; redraw(); });
  c.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') setTimeout(() => { c.hoverX = null; redraw(); }, 1500); });
}
hoverable($('chart'), () => drawChart(cur()));
hoverable($('dChart'), () => drawDetailChart());
window.addEventListener('resize', () => { drawChart(cur()); drawDetailChart(); });

// ---------- detail: tap a card for its history ----------
const ACC = '#c6f24e', WARN = '#e5a93b';
const KINDS = {
  cpu:   { title: 'CPU', key: 'cpu', top: () => 100, axis: v => v + '%', fmt: F.pct, now: s => F.pct(s.cpu) },
  mem:   { title: 'Memory', key: 'mem', top: s => s.memTotal, axis: v => F.gb(v, 0) + ' GB', fmt: v => F.gb(v) + ' GB',
           now: s => `${F.gb(s.memUsed)}<small>/ ${F.gb(s.memTotal, 0)} GB</small>`, also: { key: 'swap', color: WARN, label: 'Swap' }, label: 'Used' },
  therm: { title: 'Temperature', key: 'temp', top: () => 120, axis: v => v + '°', fmt: F.temp, now: s => `${F.temp(s.tCPU)}<small>CPU</small>` },
  gpu:   { title: 'GPU', key: 'gpu', top: () => 100, axis: v => v + '%', fmt: F.pct, now: s => F.pct(s.gpu) },
  fan:   { title: 'Fan', key: 'fan', axis: v => F.rpm(v), fmt: v => F.rpm(v) + ' rpm',
           now: s => s.fans.length ? `${F.rpm(s.fans[0].rpm)}<small>rpm</small>` : '—' },
  disk:  { title: 'Storage', key: 'free', axis: v => v ? F.size(v) : '0 GB', fmt: v => F.size(v) + ' free',
           now: s => bootOf(s) ? `${F.size(bootOf(s).free).replace(' ', '<small>')} free</small>` : '—' },
};
st.detail = null; st.drange = 2;

function openDetail(kind) {
  st.detail = kind; st.drange = kind === 'disk' ? 3 : 2;
  $('dChart').hoverX = null; lastExtra = '';
  const h = cur();
  if (kind === 'disk') { loadSSD(h); loadSpace(h, false); }
  if (!$('sheet').open) { $('sheet').showModal(); $('sheet').focus(); }
  document.documentElement.classList.add('locked');
  loadHistory(st.drange);
  renderDetail();
}
$('sheet').addEventListener('close', () => { st.detail = null; document.documentElement.classList.remove('locked'); });
$('done').addEventListener('click', () => $('sheet').close());
document.addEventListener('click', e => {
  const t = e.target.closest('[data-detail]');
  if (t && !e.target.closest('dialog')) openDetail(t.dataset.detail);
});
$('dRanges').addEventListener('click', e => {
  const i = [...$('dRanges').children].indexOf(e.target.closest('button'));
  if (i < 0) return;
  st.drange = i + 1; $('dChart').hoverX = null; loadHistory(st.drange); renderDetail();
});
$('dExtra').addEventListener('click', e => { if (e.target.closest('[data-act=measure]')) loadSpace(cur(), true); });

async function loadSSD(h) {
  if (h.ssd !== undefined || h.base == null) return;
  try { h.ssd = await fetch(h.base + 'ssd').then(r => r.json()); } catch { h.ssd = undefined; }
  renderDetail();
}
async function loadSpace(h, fresh) {
  if (h.base == null) return;
  try { h.space = await fetch(h.base + 'space' + (fresh ? '?fresh=1' : ''), { cache: 'no-store' }).then(r => r.json()); } catch {}
  renderDetail();
  if (h.space?.running && st.detail === 'disk' && cur() === h && !document.hidden) setTimeout(() => loadSpace(h, false), 1500);
}

let lastExtra = '';
function renderDetail() {
  const kind = st.detail;
  if (!kind) return;
  const h = cur(), s = h.state === 'off' ? null : h.snap, K = KINDS[kind];
  $('dTitle').textContent = `${K.title} · ${shortName(h)}`;
  $('dNow').innerHTML = s ? K.now(s) : '—';
  [...$('dRanges').children].forEach((b, i) => b.classList.toggle('on', i + 1 === st.drange));
  $('dSub').innerHTML = kind === 'disk' ? forecast(h, s) : '';
  drawDetailChart();
  const extra = s ? EXTRA[kind](h, s) : '';
  if (extra !== lastExtra) { $('dExtra').innerHTML = extra; lastExtra = extra; }   // unchanged HTML keeps taps and scroll intact
}

function drawDetailChart() {
  const K = KINDS[st.detail];
  if (!K) return;
  const h = cur(), s = h.snap, main = seriesOf(h, K.key, st.drange);
  // Free space is a new column: until the log has some, say so rather than draw a dot at "now".
  if (K.key === 'free' && !(h.hist[RANGES[st.drange]]?.rows || []).some(r => r.free != null)) main.pts = [];
  const lines = [{ pts: main.pts, color: ACC, fill: true }];
  if (K.also) lines.push({ pts: seriesOf(h, K.also.key, st.drange).pts, color: K.also.color });
  plot($('dChart'), { lines, from: main.from, end: main.end, range: st.drange, top: s && K.top ? K.top(s) : 0, axis: K.axis, fmt: K.fmt,
    empty: K.key === 'free' ? 'Free space is logged from version 1.0.7; this fills in from now.' : 'Nothing logged for this range yet.' });
  $('dLegend').innerHTML = K.also ? `<div><i class="sw" style="background:${ACC}"></i>${K.label}</div><div><i class="sw" style="background:${K.also.color}"></i>${K.also.label}</div>` : '';
}

const card = (title, body, right = '') => `<section class="card"><div class="row"><h2>${title}</h2>${right}</div>${body}</section>`;
const kv = rows => `<div class="kv">${rows.filter(Boolean).map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('')}</div>`;
function procList(title, list, by) {
  const top = [...list].sort((a, b) => b[by] - a[by]).slice(0, 8);
  if (!top.length) return card(title, '<p class="empty">Gathering…</p>');
  const max = Math.max(1e-9, ...top.map(p => p[by]));
  return card(title, top.map(p => `<div class="proc"><span>${esc(p.name)}</span><b>${p.cpu.toFixed(1)}%</b><b>${F.gb(p.mem)} GB</b>
    <i class="use" style="width:${Math.max(2, p[by] / max * 100)}%"></i></div>`).join(''), '<div class="cols"><span>CPU</span><span>Memory</span></div>');
}

const EXTRA = {
  cpu: (h, s) => {
    const e = s.eCores;
    const cores = s.cores.map((v, i) => (i === e && e > 0 ? '<i class="gap"></i>' : '') + `<i><b style="height:${Math.max(3, v)}%"></b></i>`).join('');
    return card('Each core now', `<div class="cores tall">${cores}</div><div class="note">${e ? `${e} efficiency cores, then ${s.cores.length - e} performance cores` : `${s.cores.length} cores`}</div><div class="note">Load ${s.load.map(l => l.toFixed(1)).join(' / ')} over 1, 5 and 15 minutes</div>`)
      + procList('Using the CPU now', s.procs, 'cpu');
  },
  mem: (h, s) => card('Where it goes', kv([
      ['Apps', F.gb(s.memApp) + ' GB'], ['Kept by macOS (wired)', F.gb(s.memWired) + ' GB'], ['Compressed', F.gb(s.memCompressed) + ' GB'],
      ['Cached files (freed when needed)', F.gb(s.memCached) + ' GB'], ['Swap on disk', `${F.gb(s.swapUsed)} of ${F.gb(s.swapTotal)} GB`],
      ['Pressure', ['', 'Normal', 'Warning', '', 'Critical'][s.pressure] || 'Normal']]))
    + procList('Using the most memory', s.procs, 'mem'),
  therm: (h, s) => card('Sensors now', kv([
      ['CPU, hottest', F.temp(s.tCPU)], s.tCPUAvg != null && ['CPU, average', F.temp(s.tCPUAvg)], s.tGPU != null && ['GPU', F.temp(s.tGPU)],
      s.tSSD != null && ['SSD', F.temp(s.tSSD)], s.battery?.temp != null && ['Battery', F.temp(s.battery.temp)],
      ...s.fans.map((f, i) => [s.fans.length > 1 ? `Fan ${i ? 'right' : 'left'}` : 'Fan', F.rpm(f.rpm) + ' rpm']),
      ['macOS thermal state', ['Nominal', 'Fair', 'Serious: slowing the chip', 'Critical: slowing the chip'][s.thermal] || '—']])),
  gpu: (h, s) => card('Now', kv([['Busy', F.pct(s.gpu)], ['GPU drawing', F.wu(s.wGPU)], ['Neural Engine drawing', F.wu(s.wANE)]])),
  fan: (h, s) => s.fans.length ? card('Now', kv([
      ...s.fans.flatMap((f, i) => {
        const n = s.fans.length > 1 ? (i ? 'Right fan' : 'Left fan') : 'Fan';
        return [[n, F.rpm(f.rpm) + ' rpm'], [`${n} range`, `${F.rpm(f.min)}–${F.rpm(f.max)} rpm`]];
      }),
      ['Mode', ({ auto: 'Auto (macOS)', fixed: 'Fixed', curve: 'Curve' })[(s.fanPolicy || 'auto').split(' ')[0]]]])) : card('Fans', '<p class="empty">This Mac has no fans.</p>'),
  disk: (h, s) => volumesCard(s) + spaceCard(h) + ssdCard(h),
};

/** "Full in about N days" from the last week of logged free space (least squares). */
function forecast(h, s) {
  const boot = bootOf(s);
  if (!boot) return '';
  const pts = seriesOf(h, 'free', 3).pts.filter(p => p.t >= now() - 7 * 86400);
  const span = pts.length ? pts[pts.length - 1].t - pts[0].t : 0;
  if (pts.length < 6 || span < 86400) return 'The forecast starts after a day of logged free space.';
  const mt = pts.reduce((a, p) => a + p.t, 0) / pts.length, mv = pts.reduce((a, p) => a + p.v, 0) / pts.length;
  const slope = pts.reduce((a, p) => a + (p.t - mt) * (p.v - mv), 0) / pts.reduce((a, p) => a + (p.t - mt) ** 2, 0);
  const perDay = slope * 86400, days = Math.round(span / 86400);
  if (perDay < -0.2e9) {
    const left = boot.free / -perDay;
    const tone = left < 30 ? 'var(--warning)' : 'var(--text)';
    return `<b style="color:${tone}">Full in about ${left < 2 ? Math.round(left * 24) + ' hours' : Math.round(left) + ' days'}</b> at this rate: losing ${F.size(-perDay)} a day over the last ${days} days.`;
  }
  if (perDay > 0.2e9) return `Free space is growing by ${F.size(perDay)} a day over the last ${days} days.`;
  return `Steady: free space has barely changed over the last ${days} days.`;
}

function volumesCard(s) {
  return card(s.volumes.length > 1 ? 'Drives' : 'Drive', s.volumes.map(v => {
    const used = v.total - v.free;
    return `<div class="srow"><span>${esc(v.name)}${v.boot ? ' <span class="note" style="display:inline">· startup</span>' : ''}</span><b>${F.size(v.free)} free</b>
      <i class="use" style="width:${used / Math.max(1, v.total) * 100}%"></i></div><div class="note" style="margin:2px 0 4px">${F.size(used)} of ${F.size(v.total)} used</div>`;
  }).join(''));
}

function spaceCard(h) {
  const r = h.space;
  const btn = `<button class="pillbtn" data-act="measure"${r?.running ? ' disabled' : ''}>${r?.running ? 'Measuring…' : 'Measure again'}</button>`;
  if (!r) return card('What’s using the space', '<p class="empty">Measuring…</p>');
  const shown = r.items.filter(i => i.bytes > 0).slice(0, 10);
  const max = Math.max(1, ...shown.map(i => i.bytes));
  const rows = shown.map(i => `<div class="srow"><span>${esc(i.name)}</span><b>${r.partial || r.running ? '≥ ' : ''}${F.size(i.bytes)}</b><i class="use" style="width:${i.bytes / max * 100}%"></i></div>`
    + (i.children || []).filter(c => c.bytes > 0).slice(0, 5).map(c =>
      `<div class="srow sub"><span>${esc(c.name)}</span><b>${F.size(c.bytes)}</b><i class="use" style="width:${c.bytes / max * 100}%"></i></div>`).join('')).join('');
  const measured = r.items.reduce((a, i) => a + i.bytes, 0), rest = r.total - r.free - measured;
  const restRow = !r.running && !r.partial && rest > 1e9 ? `<div class="srow"><span style="color:var(--muted)">Everything else: macOS, system data, the folders left alone</span><b>${F.size(rest)}</b></div>` : '';
  const alone = (r.leftAlone || []).map(n => n === '.Trash' ? 'Trash' : n);
  const meta = r.running ? `Measuring… ${Math.round(r.seconds)} s` : `Measured ${ago(r.t)} in ${Math.round(r.seconds)} s` + (r.partial ? '. It ran out of time, so these are “at least”.' : '.');
  return card('What’s using the space', `<p class="fine" style="margin-top:4px">${meta}</p>${rows}${restRow}
    ${r.purgeable > 1e9 ? `<p class="fine">${F.size(r.purgeable)} of the used space is purgeable: macOS frees it by itself when space runs low.</p>` : ''}
    ${r.snapshots ? `<p class="fine">${r.snapshots} Time Machine local snapshot${r.snapshots > 1 ? 's' : ''} on this drive.</p>` : ''}
    ${alone.length ? `<p class="fine">Left alone, so macOS never has to ask for permission and nothing in the cloud gets downloaded: ${alone.map(esc).join(', ')}. Their space is in “everything else”.</p>` : ''}`, btn);
}

function ssdCard(h) {
  const d = h.ssd;
  if (d === undefined) return card('SSD health', '<p class="empty">Reading…</p>');
  if (!d) return card('SSD health', '<p class="empty">This drive does not report its health.</p>');
  const bad = d.warning !== 0 || d.mediaErrors > 0 || d.spare < d.spareThreshold;
  const flag = bad ? pill('Check it', 'bad') : d.percentUsed >= 80 ? pill('Worn', 'warn') : pill('Healthy', 'good');
  return card('SSD health', `<div class="note" style="margin-top:2px">${esc(d.model)}</div>
    <div class="mid" style="margin:10px 0 8px">${Math.max(0, 100 - d.percentUsed)}%<small>of rated life left</small></div>${bar(d.percentUsed / 100, d.percentUsed >= 80 ? 'var(--warning)' : 'var(--chart2)')}
    ${kv([['Written', F.size(d.written)], ['Read', F.size(d.read)], ['Powered on', `${Math.round(d.hours).toLocaleString('en-US')} h · ${Math.round(d.cycles)} starts`],
      ['Spare blocks', `${d.spare}%`], ['Media errors', String(d.mediaErrors)], ['Unexpected power-offs', String(d.unsafeShutdowns)], d.temp != null && ['Temperature', F.temp(d.temp)]])}
    <p class="fine">The drive’s own report (NVMe SMART). “Rated life” is its estimate of wear; most Macs never come close.</p>`, flag);
}

// ---------- apps: list, quit and open ----------
// Only on this Mac's own page, and only from the devices `vitals-agent control on` named; the Mac
// checks that on every request. 'off' hides the card; 'denied' says why. On the other Mac's tab the
// card only points to that Mac's own page: this page never holds the keys to it.
const ap = { state: 'unknown', list: [], recent: [], err: '', ask: null, quitting: {}, all: false, installed: null, opening: null,
             sort: store.get('appSort', 'mem') === 'cpu' ? 'cpu' : 'mem' };

async function loadApps() {
  if (st.host !== 'here' || document.hidden) return;
  try {
    const r = await fetch('apps', { cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (r.status === 404) ap.state = 'off';
    else if (!r.ok) { ap.state = 'denied'; ap.denied = j.error || 'This device can’t control apps on this Mac.'; }
    else {
      ap.state = 'on'; ap.list = j.apps; ap.recent = j.recent; ap.screen = !!j.screen;
      for (const id in ap.quitting) if (!ap.list.some(a => a.id === id)) delete ap.quitting[id];
    }
  } catch {}
  renderApps();
}

let lastApps = '', errTimer = 0;
function appsError(msg) {
  ap.err = msg; renderApps();
  clearTimeout(errTimer); errTimer = setTimeout(() => { ap.err = ''; renderApps(); }, 6000);
}

function renderApps() {
  const card = $('appsCard'), P = cur(), peer = isPeer(P);
  card.hidden = peer ? !P.apps || P.state === 'off' : !['on', 'denied'].includes(ap.state);
  if (card.hidden) return;
  const on = !peer && ap.state === 'on';
  $('openApp').hidden = $('appsMeta').hidden = !on;
  $('screenBtn').hidden = !on || !ap.screen;
  $('appsTitle').textContent = peer ? `Apps on ${shortName(P)}` : 'Apps';
  $('appsErr').textContent = peer ? '' : ap.err;
  for (const b of $('appSort').children) b.classList.toggle('on', b.dataset.k === ap.sort);
  let html;
  if (peer) html = `<p class="fine" style="margin-top:6px">Quit and open ${esc(shortName(P))}’s apps from its own page.</p>
    <a class="pillbtn" href="${esc(P.base)}" rel="noopener">Open ${esc(shortName(P))}’s page<i class="more">›</i></a>`
    + (P.screen ? ` <a class="pillbtn" href="${esc(P.base)}screen/" rel="noopener">${esc(shortName(P))}’s screen<i class="more">›</i></a>` : '');
  else if (ap.state === 'denied') html = `<p class="empty">${esc(ap.denied)}</p>`;
  else {
    const list = [...ap.list].sort((a, b) => b[ap.sort] - a[ap.sort]);
    const shown = ap.all ? list : list.slice(0, 8);
    const total = ap.list.reduce((t, a) => t + a.mem, 0);
    $('appsSum').textContent = `${ap.list.length} open · ${F.mem(total)}`;
    html = shown.map(appRow).join('') || '<p class="empty">No apps open.</p>';
    if (list.length > 8) html += `<button class="link" data-act="all" style="margin-top:10px">${ap.all ? 'Show fewer' : `Show all ${list.length}`}<i class="more">›</i></button>`;
    if (ap.recent.length) html += `<div class="recent"><h3>Recent activity</h3>${ap.recent.slice(0, 3).map(e =>
      `<div class="ev${e.kind === 'done' ? '' : ' bad'}"><span>${esc(e.text.replace(/ · [\d.]+ MB from the Mac.*$/, ''))}</span><span>${ago(e.t)}</span></div>`).join('')}</div>`;
  }
  if (html !== lastApps) { $('apps').innerHTML = html; lastApps = html; }   // unchanged HTML keeps a tap in flight intact
}

function appRow(a) {
  const q = ap.quitting[a.id], stuck = q && Date.now() - q.at > 8000;
  const ask = kind => ap.ask === `${kind}:${a.id}`;
  const btn = (kind, label) => `<button class="pillbtn${ask(kind) ? ' ask' : ''}" data-act="${kind}" data-id="${esc(a.id)}"
    aria-label="${ask(kind) ? `Tap again to ${label.toLowerCase()} ${esc(a.name)}` : `${label} ${esc(a.name)}`}">${ask(kind) ? label + '?' : label}</button>`;
  const right = a.locked ? '<span class="sub">Protected</span>'
    : stuck ? btn('force', 'Force quit') : q ? `<span class="sub">${q.force ? 'Force quitting…' : 'Quitting…'}</span>` : btn('quit', 'Quit');
  const sub = stuck ? 'Still open: it may be asking to save' : a.locked ? 'Keeps this page reachable'
    : `${F.mem(a.mem)} · ${a.cpu.toFixed(1)}% CPU${a.copies > 1 ? ` · ${a.copies} copies` : ''}${a.hidden ? ' · hidden' : ''}`;
  return `<div class="app"><img src="apps/icon?id=${encodeURIComponent(a.id)}" alt="" loading="lazy">
    <div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="sub"${stuck ? ' style="color:var(--warning)"' : ''}>${sub}</div></div>${right}</div>`;
}

async function quitApp(a, force) {
  ap.ask = null;
  ap.quitting[a.id] = { at: Date.now(), force };
  renderApps();
  try {
    const r = await fetch('apps/quit', { method: 'POST', headers: { 'X-Vitals': '1' }, body: `${force ? 'force' : 'quit'} ${a.id}` });
    if (!r.ok) { delete ap.quitting[a.id]; appsError((await r.json().catch(() => ({}))).error || 'The Mac refused.'); }
  } catch { delete ap.quitting[a.id]; appsError('The Mac did not answer.'); }
  loadApps(); setTimeout(loadApps, 1200);     // most apps are gone within a second
}

let askTimer = 0;
$('apps').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'all') { ap.all = !ap.all; return renderApps(); }
  const a = ap.list.find(x => x.id === b.dataset.id);
  if (!a) return;
  const key = `${b.dataset.act}:${a.id}`;
  if (ap.ask === key) return quitApp(a, b.dataset.act === 'force');
  ap.ask = key; renderApps();
  clearTimeout(askTimer);
  askTimer = setTimeout(() => { ap.ask = null; renderApps(); }, 4000);
});
$('appSort').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  ap.sort = b.dataset.k; store.set('appSort', ap.sort); renderApps();
});

$('openApp').addEventListener('click', async () => {
  $('pSearch').value = ''; $('pErr').textContent = ''; ap.opening = null;
  $('picker').showModal(); $('picker').focus();
  document.documentElement.classList.add('locked');
  renderPicker();
  if (!ap.installed) {
    try { const r = await fetch('apps/installed', { cache: 'no-store' }); if (r.ok) ap.installed = await r.json(); } catch {}
    renderPicker();
  }
});
function renderPicker() {
  if (!ap.installed) { $('pList').innerHTML = '<p class="empty">Loading…</p>'; return; }
  const q = $('pSearch').value.trim().toLowerCase(), running = new Set(ap.list.map(a => a.id));
  const list = ap.installed.filter(a => !q || a.name.toLowerCase().includes(q));
  $('pList').innerHTML = list.map(a => `<button class="app" data-id="${esc(a.id)}"><img src="apps/icon?id=${encodeURIComponent(a.id)}" alt="" loading="lazy">
    <span class="nm">${esc(a.name)}</span><span class="sub">${ap.opening === a.id ? 'Opening…' : running.has(a.id) ? 'Running' : ''}</span></button>`).join('')
    || '<p class="empty">No apps match.</p>';
}
$('pSearch').addEventListener('input', renderPicker);
$('pDone').addEventListener('click', () => $('picker').close());
$('picker').addEventListener('close', () => document.documentElement.classList.remove('locked'));
$('pList').addEventListener('click', async e => {
  const b = e.target.closest('[data-id]');
  if (!b || ap.opening) return;
  ap.opening = b.dataset.id; $('pErr').textContent = ''; renderPicker();
  try {
    const r = await fetch('apps/open', { method: 'POST', headers: { 'X-Vitals': '1' }, body: ap.opening });
    if (r.ok) { $('picker').close(); loadApps(); setTimeout(loadApps, 1500); }
    else $('pErr').textContent = (await r.json().catch(() => ({}))).error || 'The Mac refused.';
  } catch { $('pErr').textContent = 'The Mac did not answer.'; }
  ap.opening = null; renderPicker();
});

// ---------- actions: saved commands, run with two taps ----------
// The page names an action only by its id; what it runs was set on the Mac (`vitals-agent action add`),
// so nothing sent from here can become a command. Shown with the Apps card: same devices, same checks.
// Polled every second while one runs (elapsed time and output as it comes), otherwise every 15 s so an
// action just added on the Mac shows up. On the other Mac's tab, only a link to its own page.
const ac = { state: 'unknown', list: [], ask: null, open: null, err: '', peers: {} };
const actionRunning = () => ac.list.some(a => a.running);

async function loadActions() {
  if (st.host !== 'here' || document.hidden) return;
  try {
    // The output in full only for the one being read; the rest come as a short glance.
    const r = await fetch('actions' + (ac.open ? `?output=${encodeURIComponent(ac.open)}` : ''), { cache: 'no-store' });
    if (r.status === 404) ac.state = 'off';
    else if (!r.ok) ac.state = 'denied';
    else { ac.state = 'on'; ac.list = await r.json(); }
  } catch {}
  renderActions();
}

/** How many actions another Mac has (a number, never their names), once a minute while its tab is open. */
async function peerActions(P) {
  const c = ac.peers[P.key];
  if (c && Date.now() - c.at < 60000) return;
  ac.peers[P.key] = { at: Date.now(), count: c?.count || 0 };
  try { const r = await fetch(P.base + 'actions/count', { cache: 'no-store' }); if (r.ok) { ac.peers[P.key].count = (await r.json()).count; renderActions(); } } catch {}
}

let lastActions = '', actionsErrTimer = 0, actionsAskTimer = 0;
function actionsError(msg) {
  ac.err = msg; renderActions();
  clearTimeout(actionsErrTimer); actionsErrTimer = setTimeout(() => { ac.err = ''; renderActions(); }, 6000);
}

function renderActions() {
  const card = $('actionsCard'), P = cur(), peer = isPeer(P);
  if (peer && P.apps && P.state !== 'off') peerActions(P);
  const count = peer ? ac.peers[P.key]?.count || 0 : ac.list.length;
  card.hidden = !count || (peer ? !P.apps || P.state === 'off' : ap.state !== 'on' || ac.state !== 'on');
  if (card.hidden) return;
  $('actionsTitle').textContent = peer ? `Actions on ${shortName(P)}` : 'Actions';
  $('actionsErr').textContent = peer ? '' : ac.err;
  const html = peer ? `<p class="fine" style="margin-top:6px">Run ${count === 1 ? 'its action' : `its ${count} actions`} from ${esc(shortName(P))}’s own page.</p>
    <a class="pillbtn" href="${esc(P.base)}" rel="noopener">Open ${esc(shortName(P))}’s page<i class="more">›</i></a>`
    : ac.list.map(actionRow).join('');
  if (html === lastActions) return;                 // unchanged HTML keeps a tap in flight intact
  // Keep the open output where the reader left it: following the end, or scrolled back.
  const was = $('actions').querySelector('.out'), end = !was || was.scrollTop + was.clientHeight >= was.scrollHeight - 4, top = was?.scrollTop;
  $('actions').innerHTML = html; lastActions = html;
  const out = $('actions').querySelector('.out');
  if (out) out.scrollTop = end ? out.scrollHeight : top;
}

const ranFor = s => s < 0.1 ? 'under 0.1 s' : s < 10 ? s.toFixed(1) + ' s' : s < 60 ? Math.round(s) + ' s' : F.dur(s);
const elapsed = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function actionRow(a) {
  const l = a.last, ask = ac.ask === a.id, open = ac.open === a.id;
  const btn = a.running ? `<button class="pillbtn" data-act="stop" data-id="${esc(a.id)}" aria-label="Stop ${esc(a.name)}">Stop</button>`
    : `<button class="pillbtn${ask ? ' go' : ''}" data-act="run" data-id="${esc(a.id)}"
        aria-label="${ask ? `Tap again to run ${esc(a.name)}` : `Run ${esc(a.name)}`}">${ask ? 'Run?' : 'Run'}</button>`;
  const ok = l && l.exit === 0 && !l.why;
  // "Stopped" or "Timed out after 10 min"; who stopped it is in the activity log, and the line stays short.
  const why = l?.why ? l.why[0].toUpperCase() + l.why.slice(1).replace(/ from .*$/, '') + ' · ' : '';
  const sub = a.running ? `<span class="ok">Running · ${elapsed(a.seconds)}</span>`
    : l ? `<span><span class="${ok ? 'ok' : 'bad'}">${ok ? '✓' : '✗'}</span> ${esc(why)}exit ${l.exit} · ${ranFor(l.seconds)} · ${ago(l.t)}</span>`
    : '<span>Not run yet</span>';
  const text = a.running ? a.output : l?.outputTail;
  const more = a.running || l ? `<button class="link" data-act="out" data-id="${esc(a.id)}" aria-expanded="${open}">${open ? 'Hide output' : 'Output'}<i class="more">${open ? '‹' : '›'}</i></button>` : '';
  return `<div class="act"><div class="row"><div style="min-width:0"><div class="nm">${esc(a.name)}</div><div class="sub">${sub}${more}</div></div>${btn}</div>`
    + (open ? `<pre class="out">${text ? esc(text) : a.running ? 'Nothing printed yet.' : 'It printed nothing.'}</pre>` : '') + '</div>';
}

async function actionPost(what, a) {
  ac.ask = null;
  if (what === 'run') ac.open = a.id;              // what you just ran is what you want to watch
  renderActions();
  try {
    const r = await fetch('actions/' + what, { method: 'POST', headers: { 'X-Vitals': '1' }, body: a.id });
    if (!r.ok) actionsError((await r.json().catch(() => ({}))).error || 'The Mac refused.');
  } catch { actionsError('The Mac did not answer.'); }
  loadActions();
}

$('actions').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  const a = b && ac.list.find(x => x.id === b.dataset.id);
  if (!a) return;
  if (b.dataset.act === 'out') { ac.open = ac.open === a.id ? null : a.id; renderActions(); return loadActions(); }
  if (b.dataset.act === 'stop') return actionPost('stop', a);
  if (ac.ask === a.id) return actionPost('run', a);
  ac.ask = a.id; renderActions();
  clearTimeout(actionsAskTimer);
  actionsAskTimer = setTimeout(() => { ac.ask = null; renderActions(); }, 4000);
});
setInterval(() => { if (actionRunning()) loadActions(); }, 1000);
setInterval(() => { if (!actionRunning()) loadActions(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadActions(); });
loadActions();
// ---------- end actions ----------

// ---------- lifecycle ----------
document.addEventListener('visibilitychange', () => { connect(); if (!document.hidden) { loadHistory(); loadApps(); } });
setInterval(() => { if (!document.hidden) loadHistory(); if (ap.state !== 'on') loadApps(); }, 60000);
setInterval(() => { if (ap.state === 'on') loadApps(); }, 3000);
setInterval(() => {         // a stream that went quiet: the Mac fell asleep or left the tailnet
  const h = cur();
  if (isPeer(h) && h.state === 'live' && now() - h.seen > 8) { h.state = 'off'; render(); }
}, 2000);
setInterval(() => {         // a fan off Auto stays there only while this page keeps checking in
  if (!document.hidden && st.host === 'here' && (st.here.snap?.fanPolicy || 'auto') !== 'auto')
    fetch('alive', { method: 'POST', headers: { 'X-Vitals': '1' } }).catch(() => {});
}, 20000);

// The fleet: your Macs from Tailscale, then each one's last minute (/summary), without starting any
// sampling. Every minute while the page is open; a Mac that never answers is shown as not set up.
let legacyPeer = null;
async function probe(h) {
  try {
    const r = await fetch(h.base + 'summary', { cache: 'no-store' });
    if (!r.ok) throw 0;
    const m = await r.json();
    h.sum = m; h.info = m.info; h.apps = !!m.apps; h.screen = !!m.screen; h.vitals = true;
    if (h.state !== 'live') h.state = 'up';
    if (!h.seen && m.t) h.seen = m.t;
    remember(h);
  } catch {
    if (h === st.here) return;
    if (h.state !== 'live') h.state = 'off';
    if (h.vitals === undefined) h.vitals = h.online === false ? undefined : false;   // reachable, but no Vitals
  }
}
async function probeFleet() {
  try {
    const f = await fetch('fleet', { cache: 'no-store' }).then(r => r.json());
    for (const m of f.members) { if (m.me) st.here.name = m.name; else peerFor(m); }
  } catch {}
  if (legacyPeer && !st.peers.some(p => p.base === legacyPeer)) {
    const host = new URL(legacyPeer).host;
    peerFor({ host, url: legacyPeer, name: fleetSeen[host]?.name || guessName(legacyPeer), online: true });
  }
  await Promise.all([st.here, ...st.peers].map(probe));
  connect(); render();
}
setInterval(() => { if (!document.hidden) probeFleet(); }, 60000);

fetch('config', { cache: 'no-store' }).then(r => r.json()).then(c => { legacyPeer = c.peer || null; st.here.info = c.info; })
  .catch(() => {}).finally(() => { connect(); loadHistory(); loadApps(); probeFleet(); render(); });
render();
</script>
</body>
</html>
